[tool.poetry]
name = "ibroadcast-sync"
version = "0.3.0"
description = "Upload and sync (playlists, ratings) between Music.app (macOS) and iBroadcast."
authors = ["Jeromearsene"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ibroadcast_sync", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
requests = ">=2.32,<3.0"
rich = ">=13.7,<16"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.13"
mypy = "^1.11"
types-requests = ">=2.32,<3.0"

[tool.poetry.scripts]
ibroadcast-sync = "ibroadcast_sync.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ibroadcast_sync --cov-report=term-missing"

# --------------------------------------------------------------------------
# mypy - https://mypy.readthedocs.io/
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# --------------------------------------------------------------------------
# Ruff (linter + formatter) - https://docs.astral.sh/ruff/
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common bug patterns)
    "UP",   # pyupgrade (modern syntax for the target Python version)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length - the formatter handles wrapping where it can;
             # some f-string log/help messages are clearer on one line.
]

[tool.ruff.lint.isort]
known-first-party = ["ibroadcast_sync"]

[tool.ruff.lint.per-file-ignores]
# JXA (JavaScript) source embedded as triple-quoted strings reads like
# "unused variables" to some checks - not applicable there.
"src/ibroadcast_sync/musicapp.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
